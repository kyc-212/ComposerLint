name: ComposerLint Windows NTFS feasibility pilot

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA reviewed for this pilot
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-ntfs:
    if: >-
      github.repository == 'kyc-212/ComposerLint' &&
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/codex/windows-ci-pilot' &&
      github.sha == inputs.expected_sha
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed source
        id: reviewed-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Run native NTFS controls using the runner's Python
        shell: pwsh
        run: |
          python -I -S -B -c "import sys; assert sys.platform == 'win32' and sys.implementation.name == 'cpython' and sys.version_info[:2] == (3, 12), sys.version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -S -B -X utf8 -m unittest discover -s tests -p test_windows_read_native.py -v
          exit $LASTEXITCODE
      - name: Run Windows preflight tests
        shell: pwsh
        run: |
          python -I -S -B -X utf8 -m unittest discover -s tests -p test_windows_preflight.py -v
          exit $LASTEXITCODE
      - name: Show the standalone Windows preflight diagnostics
        shell: pwsh
        run: |
          python -I -S -B -X utf8 tools/preflight_windows.py
          exit $LASTEXITCODE
      - name: Run Windows terminal setup security fixtures
        shell: pwsh
        run: |
          python -I -S -B -X utf8 -m unittest discover -s tests -p test_windows_setup.py -v
          exit $LASTEXITCODE
      - name: Verify the checkout is clean
        if: ${{ !cancelled() && steps.reviewed-checkout.outcome == 'success' }}
        shell: pwsh
        run: |
          $changes = git status --porcelain=v1 --untracked-files=all --ignored=traditional --ignore-submodules=none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($changes) {
            $changes | Write-Output
            throw 'Checkout changed during Windows verification.'
          }
          Write-Output 'Checkout is clean: no tracked changes or unexpected files.'
