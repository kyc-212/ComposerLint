name: ComposerLint Windows NTFS feasibility pilot

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA reviewed for this pilot
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: composerlint-windows-ntfs-pilot
  cancel-in-progress: false

jobs:
  windows-ntfs:
    # One approved real installation on run 13, with no rerun.
    if: >-
      github.repository == 'kyc-212/ComposerLint' &&
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/codex/windows-ci-pilot' &&
      github.run_number == '13' && github.run_attempt == '1' &&
      github.sha == inputs.expected_sha
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed source
        id: reviewed-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Select and verify the CI-only Python from the installed tool cache
        id: runner-python
        shell: pwsh
        run: |
          ./tests/test_windows_runner_python.ps1
          . ./tools/ci_windows_runner_python.ps1
          $runnerPython = Get-VerifiedRunnerPython $env:RUNNER_TOOL_CACHE
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "path=$runnerPython" -Encoding utf8
      - name: Run native NTFS controls using the runner's Python
        shell: pwsh
        env:
          CI_RUNNER_PYTHON: ${{ steps.runner-python.outputs.path }}
        run: |
          & $env:CI_RUNNER_PYTHON -I -S -B -X utf8 -m unittest discover -s tests -p test_windows_read_native.py -v
          exit $LASTEXITCODE
      - name: Run Windows preflight tests
        shell: pwsh
        env:
          CI_RUNNER_PYTHON: ${{ steps.runner-python.outputs.path }}
        run: |
          & $env:CI_RUNNER_PYTHON -I -S -B -X utf8 -m unittest discover -s tests -p test_windows_preflight.py -v
          exit $LASTEXITCODE
      - name: Show the standalone Windows preflight diagnostics
        shell: pwsh
        env:
          CI_RUNNER_PYTHON: ${{ steps.runner-python.outputs.path }}
        run: |
          & $env:CI_RUNNER_PYTHON -I -S -B -X utf8 tools/preflight_windows.py
          exit $LASTEXITCODE
      - name: Run Windows terminal setup security fixtures
        shell: pwsh
        env:
          CI_RUNNER_PYTHON: ${{ steps.runner-python.outputs.path }}
        run: |
          & $env:CI_RUNNER_PYTHON -I -S -B -X utf8 -m unittest discover -s tests -p test_windows_setup.py -v
          exit $LASTEXITCODE
      - name: Run host snapshot and CI orchestration controls
        shell: pwsh
        env:
          CI_RUNNER_PYTHON: ${{ steps.runner-python.outputs.path }}
        run: |
          & $env:CI_RUNNER_PYTHON -I -S -B -X utf8 -m unittest discover -s tests -p test_windows_host_snapshot.py -v
          exit $LASTEXITCODE
      - name: Run the one approved Windows text installation and verify the receipt
        shell: pwsh
        env:
          REVIEWED_COMMIT: ${{ inputs.expected_sha }}
          CI_RUNNER_PYTHON: ${{ steps.runner-python.outputs.path }}
        run: |
          $local = [Environment]::GetFolderPath('LocalApplicationData')
          & $env:CI_RUNNER_PYTHON -I -S -B -X utf8 tools/ci_windows_text_setup.py $local
          exit $LASTEXITCODE
      - name: Verify the checkout is clean
        if: ${{ !cancelled() && steps.reviewed-checkout.outcome == 'success' }}
        shell: pwsh
        run: |
          $changes = git status --porcelain=v1 --untracked-files=all --ignored=traditional --ignore-submodules=none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($changes) {
            $changes | Write-Output
            throw 'Checkout changed during Windows verification.'
          }
          Write-Output 'Checkout is clean: no tracked changes or unexpected files.'
