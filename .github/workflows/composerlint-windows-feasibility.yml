name: ComposerLint Windows NTFS feasibility pilot

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA reviewed for this pilot
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: composerlint-windows-ntfs-pilot
  cancel-in-progress: false

jobs:
  windows-ntfs:
    # One approved compiler and security probe on run 15, with no rerun.
    if: >-
      github.repository == 'kyc-212/ComposerLint' &&
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/codex/windows-ci-pilot' &&
      github.run_number == '15' && github.run_attempt == '1' &&
      github.sha == inputs.expected_sha
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed source
        id: reviewed-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Select and verify the CI-only Python from the installed tool cache
        id: runner-python
        shell: pwsh
        run: |
          ./tests/test_windows_runner_python.ps1
          . ./tools/ci_windows_runner_python.ps1
          $runnerPython = Get-VerifiedRunnerPython $env:RUNNER_TOOL_CACHE
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "path=$runnerPython" -Encoding utf8
      - name: Run native NTFS controls using the runner's Python
        shell: pwsh
        env:
          CI_RUNNER_PYTHON: ${{ steps.runner-python.outputs.path }}
        run: |
          & $env:CI_RUNNER_PYTHON -I -S -B -X utf8 -m unittest discover -s tests -p test_windows_read_native.py -v
          exit $LASTEXITCODE
      - name: Run Windows preflight tests
        shell: pwsh
        env:
          CI_RUNNER_PYTHON: ${{ steps.runner-python.outputs.path }}
        run: |
          & $env:CI_RUNNER_PYTHON -I -S -B -X utf8 -m unittest discover -s tests -p test_windows_preflight.py -v
          exit $LASTEXITCODE
      - name: Show the standalone Windows preflight diagnostics
        shell: pwsh
        env:
          CI_RUNNER_PYTHON: ${{ steps.runner-python.outputs.path }}
        run: |
          & $env:CI_RUNNER_PYTHON -I -S -B -X utf8 tools/preflight_windows.py
          exit $LASTEXITCODE
      - name: Run Windows terminal setup security fixtures
        shell: pwsh
        env:
          CI_RUNNER_PYTHON: ${{ steps.runner-python.outputs.path }}
        run: |
          & $env:CI_RUNNER_PYTHON -I -S -B -X utf8 -m unittest discover -s tests -p test_windows_setup.py -v
          exit $LASTEXITCODE
      - name: Run host snapshot and CI orchestration controls
        shell: pwsh
        env:
          CI_RUNNER_PYTHON: ${{ steps.runner-python.outputs.path }}
        run: |
          & $env:CI_RUNNER_PYTHON -I -S -B -X utf8 -m unittest discover -s tests -p test_windows_host_snapshot.py -v
          exit $LASTEXITCODE
      - name: Probe the preinstalled native x64 compiler, SDK and CPython ABI
        shell: pwsh
        env:
          CI_RUNNER_PYTHON: ${{ steps.runner-python.outputs.path }}
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $instances = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $selected = @(($instances -join [Environment]::NewLine) | ConvertFrom-Json)
          if ($selected.Count -ne 1 -or !$selected[0].installationPath) {
            throw 'A preinstalled Visual Studio instance with the x64 C++ tools is required.'
          }
          Write-Output "Visual Studio $($selected[0].installationVersion) at $($selected[0].installationPath)"
          $devShell = Join-Path $selected[0].installationPath 'Common7/Tools/Launch-VsDevShell.ps1'
          & $devShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('cl.exe', 'link.exe', 'rc.exe', 'mt.exe')) {
            $tool = Get-Command $name -CommandType Application | Select-Object -First 1
            $file = Get-Item -LiteralPath $tool.Source
            Write-Output "$name file version $($file.VersionInfo.FileVersion) at $($file.FullName)"
          }
          & $env:CI_RUNNER_PYTHON -I -S -B -X utf8 tools/build_windows_renderer.py --probe-only
          exit $LASTEXITCODE
      - name: Verify the checkout is clean
        if: ${{ !cancelled() && steps.reviewed-checkout.outcome == 'success' }}
        shell: pwsh
        run: |
          $changes = git status --porcelain=v1 --untracked-files=all --ignored=traditional --ignore-submodules=none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($changes) {
            $changes | Write-Output
            throw 'Checkout changed during Windows verification.'
          }
          Write-Output 'Checkout is clean: no tracked changes or unexpected files.'
